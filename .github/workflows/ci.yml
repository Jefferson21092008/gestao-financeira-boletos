name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, cobertura e lint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas de desenvolvimento
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Verificação pré-publicação
        run: python scripts/pre_public_check.py

      - name: Verificar sintaxe
        run: python -m compileall -q .

      - name: Lint com Ruff
        run: ruff check .

      - name: Executar testes com cobertura
        run: coverage run -m unittest discover -s tests -v

      - name: Relatório de cobertura
        run: coverage report -m
