name: Relatar bug
description: Informe um problema reproduzível sem incluir dados financeiros reais.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. **Não envie banco real, boletos reais, CNPJ de clientes, logs sensíveis, senhas ou backups.**

  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: Ex. 12.1.3
    validations:
      required: true

  - type: dropdown
    id: execution
    attributes:
      label: Forma de execução
      options:
        - Python / main.py
        - EXE em pasta (onedir)
        - EXE único (onefile)
        - Outro
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Explique o problema sem dados reais de empresas ou pagamentos.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra...
        2. Clique...
        3. Informe dados fictícios...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que este relato não contém dados financeiros ou empresariais reais.
          required: true
