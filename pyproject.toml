[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    ".venv",
    ".venv-build",
    "build",
    "build_unico",
    "dist",
    "dist_unico",
]

[tool.ruff.lint]
# Começamos pelas regras que detectam erros objetivos e nomes indefinidos.
# Regras estritamente estilísticas podem ser ampliadas gradualmente sem
# transformar o primeiro CI público em uma grande refatoração cosmética.
select = ["E9", "F63", "F7", "F82"]
